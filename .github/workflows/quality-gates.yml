name: Quality gates

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Run browser and API checks
        run: npm run test:e2e
      - name: Evaluate release gate
        if: always()
        run: npm run quality:gate
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: |
            playwright-report/
            test-results/
            artifacts/playwright-results.json
          if-no-files-found: warn
          retention-days: 14
